<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>Genshin Impact Helper</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face
{
    font-family: genshinDripFont;
    src: url(GenshinImpactDRIP.ttf);
}

body{
    margin: 0;
    padding:0;
    background-image: url(Genshin_Wish_BG.jpg);
    background-size: cover;
    background-attachment: scroll;
}


header {
    font-family: genshinDripFont;
    font-size: 300%;
    margin:0;
    padding: 200px;
    height: 100px;
    background-image: -webkit-linear-gradient(90deg, white 40%, rgb(255, 242, 170) 50%), url(Genshin_Impact7.0.png);
    background-clip: text, border-box;
    background-position: left top, center 60%;
    background-repeat: no-repeat;
    background-size: cover;
    -webkit-text-fill-color: transparent;
    text-align: center;
}



</style>
</head>
<body>

<header>
<p>Genshin Impact Helper</p>
</header>
</body>
</html>
